name: CI

on:
  push:
    # auto-update/protocol-go is the synchronizer's branch. CI has to report
    # on it directly: its PR is opened with auto-merge already on, so the
    # checks must land against the branch head, not only at review time.
    branches: ["main", "auto-update/protocol-go"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false because nothing here pushes, and leaving
      # the checkout token in .git/config as an http.extraheader puts a second
      # credential in play alongside the app token embedded in the submodule
      # URLs below. It resolves in the app token's favour today -- submodule
      # checkout succeeds -- but that is precedence between two Authorization
      # sources, not something worth depending on.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Pinned to a commit SHA rather than the v3 tag: this step receives the
      # App private key, so a retargeted tag would run different code with
      # that credential. protocol-ts pins the same SHA.
      #
      # The submodules are private and pinned by SSH URL in .gitmodules.
      # Rather than carry separate read deploy keys, mint one short-lived
      # installation token from the Protocol Synchronizer app and rewrite
      # those URLs to HTTPS. The token is scoped to exactly these three
      # repositories and is revoked when the job ends.
      - name: Generate submodule read token
        id: submodule-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: thruput-protocol-go,chuckd,lib-go
          permission-contents: read

      # Deliberately not `submodules: recursive` on checkout, and three
      # repositories rather than four. chuckd carries its own scp/ submodule
      # and protocol-go carries protocol, but neither is a Go module
      # dependency -- the workspace builds with both empty,
      # because protocol-go's generated bindings are committed rather than
      # regenerated here. Recursing would only widen the token's repository
      # list to check out code nothing compiles.
      #
      # The rewrites are per-repository rather than a blanket
      # git@github.com: -> https:// rule, so nothing else in the job silently
      # changes transport.
      - name: Check out submodules
        env:
          GH_TOKEN: ${{ steps.submodule-token.outputs.token }}
        run: |
          for repo in thruput-protocol-go chuckd lib-go; do
            git config --global \
              url."https://x-access-token:${GH_TOKEN}@github.com/thruputchain/${repo}.git".insteadOf \
              "git@github.com:thruputchain/${repo}.git"
          done
          git submodule update --init chuckd lib-go protocol-go

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            chuckd/go.sum

      # go.work has `use (./chuckd)` with replace directives pointing at the
      # protocol-go and lib-go submodules, so this compiles chuckd against the
      # pinned bindings. That is the whole point of the gate: a protocol-go
      # bump that changes an API breaks here rather than on main.
      - name: Build
        run: go build ./chuckd/...

      # `go build` skips _test.go, so an API change that breaks only chuckd's
      # tests would pass the step above. vet typechecks test files without
      # running them, which closes that gap for about a second.
      #
      # Running chuckd's suite is deliberately not this repo's job. It takes
      # over four minutes on a warm cache and belongs to chuckd's own CI; the
      # question here is only whether a bumped protocol-go still compiles.
      #
      # -composites=false because goxdr emits unkeyed struct literals, the
      # same flag protocol and protocol-go pass.
      - name: Vet
        run: go vet -composites=false ./chuckd/...
