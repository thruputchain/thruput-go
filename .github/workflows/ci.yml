name: CI

on:
  push:
    # auto-update/protocol-go is the synchronizer's branch. CI has to report
    # on it directly: its PR is opened with auto-merge already on, so the
    # checks must land against the branch head, not only at review time.
    branches: ["main", "auto-update/protocol-go"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The submodules are public and pinned by HTTPS URL in .gitmodules, so
      # checkout fetches them with no credential beyond the job's own token.
      # No secrets are involved, which also means pull requests from forks
      # build the same way as branches in this repository.
      #
      # Deliberately `submodules: true` rather than `recursive`. protocol-go
      # carries protocol, but it is not a Go module dependency -- the
      # workspace builds with it empty, because protocol-go's generated
      # bindings are committed rather than regenerated here.
      #
      # persist-credentials: false because nothing here pushes.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            chuckd/go.sum

      # go.work has `use (./chuckd)` with replace directives pointing at the
      # protocol-go and lib-go submodules, so this compiles chuckd against the
      # pinned bindings. That is the whole point of the gate: a protocol-go
      # bump that changes an API breaks here rather than on main.
      - name: Build
        run: go build ./chuckd/...

      # `go build` skips _test.go, so an API change that breaks only chuckd's
      # tests would pass the step above. vet typechecks test files without
      # running them, which closes that gap for about a second.
      #
      # Running chuckd's suite is deliberately not this repo's job. It takes
      # over four minutes on a warm cache and belongs to chuckd's own CI; the
      # question here is only whether a bumped protocol-go still compiles.
      #
      # -composites=false because goxdr emits unkeyed struct literals, the
      # same flag protocol and protocol-go pass.
      - name: Vet
        run: go vet -composites=false ./chuckd/...
