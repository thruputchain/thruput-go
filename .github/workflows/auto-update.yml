name: Auto-update protocol-go

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-protocol-go
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Agent plus checkout ssh-key, the same arrangement protocol-go,
      # protocol-ts and protocol-rs use for their auto-update jobs.
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.GROUNDHOG_GO_TO_SELF_WRITE_KEY }}

      # Unlike ci.yml this keeps persist-credentials at its default, because
      # this job pushes: checkout writes the deploy key to a temp file and
      # points core.sshCommand at it, and persist-credentials: false would
      # delete both at the end of this step, leaving the push below with no
      # key.
      #
      # The push has to use that key rather than GITHUB_TOKEN -- commits
      # pushed with GITHUB_TOKEN do not start workflow runs, so ci.yml would
      # never report on the branch and auto-merge would have nothing to wait
      # for.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ssh-key: ${{ secrets.GROUNDHOG_GO_TO_SELF_WRITE_KEY }}

      # chuckd, lib-go and protocol-go are initialized, fetched anonymously: the
      # submodules are public and pinned by HTTPS URL in .gitmodules, so the
      # deploy key above is only ever used for the push. chuckd and lib-go are
      # needed only so `go mod download` below can load the workspace.
      #
      # protocol is not checked out: commit.sh's protocol= field comes from
      # `git submodule status --recursive`, which reads the nested pin out of
      # protocol-go's own index. What does NOT work is leaving protocol-go
      # uninitialized: the recursion never reaches protocol, and commit.sh does
      # not fail -- it silently emits "protocol= chuckd=..." with an empty field.
      - name: Move protocol-go to its main
        run: |
          git submodule update --init
          git -C protocol-go fetch origin main
          git -C protocol-go checkout origin/main

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: false

      # A protocol-go bump can change the module graph. Refresh go.work.sum with
      # it, or ci.yml's go.work.sum check fails the bump and auto-merge stalls.
      - name: Refresh go.work.sum
        run: go mod download

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "protocol-go pointer already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_GO_SHA=$(git -C protocol-go rev-parse --short HEAD)
          BRANCH="auto-update/protocol-go"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add protocol-go go.work.sum
          # commit.sh writes the full
          # "protocol=… chuckd=… protocol-go=… lib-go=…" line, the same
          # message a manual bump produces.
          ./commit.sh
          git push -f -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
          else
            gh pr create \
              --title "Auto-update protocol-go to ${PROTOCOL_GO_SHA}" \
              --body "Automated protocol-go submodule pointer bump.

          protocol-go: thruputchain/thruput-protocol-go@${PROTOCOL_GO_SHA}

          Auto-merges once the build check confirms chuckd still compiles
          against the bumped bindings. If it goes red, chuckd most likely
          needs a companion bump -- see #19 for the shape of that fix." || true
          fi

          gh pr merge "$BRANCH" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
