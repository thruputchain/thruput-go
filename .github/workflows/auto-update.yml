name: Auto-update protocol-go

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qualify-private-thruput-go
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Agent plus checkout ssh-key, the same arrangement protocol-go,
      # protocol-ts and protocol-rs use for their auto-update jobs.
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.GROUNDHOG_GO_TO_SELF_WRITE_KEY }}

      # Unlike ci.yml this keeps persist-credentials at its default, because
      # this job pushes: checkout writes the deploy key to a temp file and
      # points core.sshCommand at it, and persist-credentials: false would
      # delete both at the end of this step, leaving the push below with no
      # key.
      #
      # The push has to use that key rather than GITHUB_TOKEN -- commits
      # pushed with GITHUB_TOKEN do not start workflow runs, so ci.yml would
      # never report on the branch and auto-merge would have nothing to wait
      # for.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ssh-key: ${{ secrets.GROUNDHOG_GO_TO_SELF_WRITE_KEY }}
          fetch-depth: 2 # Include the reviewed parent for workflow restoration.

      # Pinned to a commit SHA rather than the v3 tag: this step receives the
      # App private key, so a retargeted tag would run different code with
      # that credential. Same SHA protocol-ts pins.
      #
      # One repository. This job never builds, so it does not need chuckd or
      # lib-go, and it does not need protocol either: commit.sh's protocol=
      # field comes from `git submodule status --recursive`, which reads the
      # nested pin out of protocol-go's own index without checking protocol
      # out. See the checkout step below.
      - name: Generate submodule read token
        id: submodule-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: thruput-protocol-go
          permission-contents: read

      # The rewrites are per-repository on purpose. A blanket
      # git@github.com: -> https:// rule would also capture this repository's
      # own origin and send the push below over the app token instead of the
      # deploy key.
      #
      # Only protocol-go is initialized. commit.sh builds its message from
      # `git submodule status --recursive`, and every field that needs
      # resolves from an index rather than a worktree: chuckd and lib-go from
      # this repo's index, and protocol-go/protocol from protocol-go's index
      # once protocol-go itself is present. Checking protocol out would add a
      # repository to the token for a hash we can already read.
      #
      # What does NOT work is initializing nothing: with protocol-go absent
      # the recursion never reaches protocol, and commit.sh does not fail --
      # it silently emits "protocol= chuckd=..." with an empty field.
      - name: Move protocol-go to its main
        env:
          GH_TOKEN: ${{ steps.submodule-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/thruputchain/thruput-protocol-go.git".insteadOf \
            "git@github.com:thruputchain/thruput-protocol-go.git"
          git submodule update --init protocol-go
          git -C protocol-go fetch origin 8ebc218fec5e8a61f0c1ed743a7bc59fa0ee7e61
          git -C protocol-go checkout 8ebc218fec5e8a61f0c1ed743a7bc59fa0ee7e61

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "protocol-go pointer already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_GO_SHA=$(git -C protocol-go rev-parse --short HEAD)
          BRANCH="qualification/private-protocol-go"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git show 7d6a840a5a9a25bb048ad60be79070361d8d5d5d:.github/workflows/auto-update.yml > .github/workflows/auto-update.yml
          git add protocol-go .github/workflows/auto-update.yml
          # commit.sh writes the full
          # "protocol=… chuckd=… protocol-go=… lib-go=…" line, the same
          # message the manual bump-groundhog-go path produces.
          ./commit.sh
          git push -f -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
          else
            gh pr create \
              --draft --base repair-private-protocol-routing \
              --title "Qualify private Go workspace updater at ${PROTOCOL_GO_SHA}" \
              --body "Isolated private protocol-go read, retained write-key push and draft PR qualification. Production workflow is restored in the generated branch. Do not merge.

          protocol-go: thruputchain/thruput-protocol-go@${PROTOCOL_GO_SHA}

          This qualification never enables automatic merge."
          fi

          # Qualification stays draft; no automatic merge.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
